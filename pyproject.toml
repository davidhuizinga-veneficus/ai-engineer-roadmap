[project]
name = "ai-engineer-roadmap"
version = "0.1.0"
description = "A self-study roadmap from data science trainee to Junior AI Engineer."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
    "ruff>=0.16.9",
    "zensical>=0.0.68",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["tests"]
